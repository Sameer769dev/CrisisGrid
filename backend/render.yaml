services:
  - type: web
    name: crisisgrid-api
    runtime: python
    rootDir: ./backend
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: MODEL_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9

